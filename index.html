<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jacob's Diet Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
/* Layout: sticky date bar; a nutrition-label summary on top, then the tap-to-log picker and the day's log.
   Two columns from 920px (label + log left, picker right). */
:root {
  --bg: #F1F3F0;
  --paper: #FFFFFF;
  --ink: #131714;
  --muted: #5D665F;
  --line: #D6DBD5;
  --soft: #E7EBE6;
  --accent: #17704A;
  --accent-soft: #DCEFE4;
  --on-accent: #FFFFFF;
  --pro: #2B58C4;
  --carb: #B07A0C;
  --fat: #B0512D;
  --over: #C0342A;
  --toast-accent: #8FE0B5;
  --font: "Archivo", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1110; --paper: #171B19; --ink: #EAEEEA; --muted: #97A199; --line: #2B312D; --soft: #222825;
    --accent: #4CBD88; --accent-soft: #1C3328; --on-accent: #08130D;
    --pro: #7FA3F3; --carb: #E1AF48; --fat: #E2855F; --over: #F26A5E; --toast-accent: #12613F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1110; --paper: #171B19; --ink: #EAEEEA; --muted: #97A199; --line: #2B312D; --soft: #222825;
  --accent: #4CBD88; --accent-soft: #1C3328; --on-accent: #08130D;
  --pro: #7FA3F3; --carb: #E1AF48; --fat: #E2855F; --over: #F26A5E; --toast-accent: #12613F;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sheet:focus, .sheet:focus-visible { outline: none; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.topbar-in, .wrap {
  max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar-in { display: flex; align-items: center; gap: 8px; padding-block: 10px; flex-wrap: wrap; }
.datenav { display: flex; align-items: center; gap: 2px; }
.iconbtn {
  width: 36px; height: 36px; border-radius: 50%; border: 0; background: transparent;
  display: grid; place-items: center; font-size: 20px; line-height: 1; color: var(--ink);
}
.iconbtn:hover { background: var(--soft); }
.date-title { font-weight: 800; font-size: 17px; font-stretch: 88%; letter-spacing: 0.01em; padding-inline: 4px; white-space: nowrap; }
.today-link {
  border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 3px 10px; font-size: 12px; color: var(--muted);
}
.daytype { margin-left: auto; display: flex; background: var(--soft); border-radius: 999px; padding: 3px; }
.daytype button {
  border: 0; background: transparent; border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--muted);
}
.daytype button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.mini { width: 100%; display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); }
.mini b { color: var(--ink); font-weight: 700; }
.mini .over { color: var(--over); }

/* ---------- page ---------- */
.wrap { padding-block: 16px 40px; }
.grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); grid-template-areas: "facts" "picker" "log" "foot"; }
.a-facts { grid-area: facts; } .a-picker { grid-area: picker; } .a-log { grid-area: log; } .a-foot { grid-area: foot; }
@media (min-width: 920px) {
  .grid {
    grid-template-columns: minmax(0, 400px) minmax(0, 1fr); align-items: start;
    grid-template-rows: auto auto auto 1fr;
    grid-template-areas: "facts picker" "log picker" "foot picker" ". picker";
  }
  .mini { display: none; }
}
.notice { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; color: var(--muted); }

/* ---------- nutrition label ---------- */
.facts { background: var(--paper); border: 2px solid var(--ink); border-radius: 4px; padding: 10px 14px 12px; }
.facts-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.facts h2 { margin: 0; font-size: 30px; font-weight: 900; font-stretch: 72%; letter-spacing: -0.01em; line-height: 1; }
.facts-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.tedit {
  border: 1.5px solid var(--ink); background: transparent; color: var(--ink); border-radius: 999px;
  padding: 3px 11px; font-size: 12.5px; font-weight: 700; line-height: 1.3; white-space: nowrap;
}
.tedit:hover { background: var(--soft); }
.tcard { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.tcard.cur { border-color: var(--accent); background: var(--accent-soft); }
.tcard-h { display: flex; align-items: center; gap: 8px; }
.tcard-h b { font-size: 16px; font-weight: 800; }
.tbadge { font-size: 11px; font-weight: 700; color: var(--on-accent); background: var(--accent); border-radius: 999px; padding: 1px 8px; }
.tk { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 700; }
.tk-in { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600; min-width: 0; }
.tk input {
  width: 116px; font-size: 22px; font-weight: 800; text-align: right; padding: 6px 10px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
}
.tm { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tm label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; min-width: 0; }
.tm input { flex: 1; width: 100%; min-width: 0; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); text-align: right; }
.tsum { font-size: 12px; margin: 0; }
.rule-xl { height: 9px; background: var(--ink); margin: 8px 0 6px; }
.rule-m { height: 4px; background: var(--ink); margin: 8px 0 4px; }
.hair { height: 1px; background: var(--ink); opacity: .35; }
.energy { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.energy .lbl { font-weight: 900; font-size: 20px; font-stretch: 80%; }
.energy .kj { font-size: 11.5px; color: var(--muted); }
.unit-sw { display: inline-flex; margin-top: 4px; border: 1.5px solid var(--ink); border-radius: 999px; overflow: hidden; }
.unit-sw button { border: 0; background: transparent; color: var(--ink); font-size: 11.5px; font-weight: 700; padding: 2px 9px; line-height: 1.4; }
.unit-sw button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.energy-num { text-align: right; }
.energy-num .big { font-size: 46px; font-weight: 900; font-stretch: 78%; line-height: .95; letter-spacing: -0.02em; }
.energy-num .of { display: block; font-size: 13px; color: var(--muted); }
.track { position: relative; height: 8px; background: var(--soft); border-radius: 4px; overflow: hidden; margin-top: 8px; }
.track i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--ink); transition: width .35s ease; }
.track.over i { background: var(--over); }
.remain { margin-top: 6px; font-size: 13.5px; font-weight: 600; }
.remain.over { color: var(--over); }
.facts-cols { display: grid; grid-template-columns: 1fr auto 52px; gap: 8px; font-size: 11px; color: var(--muted); padding: 2px 0 4px; letter-spacing: .04em; }
.facts-cols span:nth-child(n+2) { text-align: right; }
.mrow { padding: 6px 0 7px; border-top: 1px solid var(--line); }
.mrow-top { display: grid; grid-template-columns: 1fr auto 52px; gap: 8px; align-items: baseline; }
.mrow-top .name { font-weight: 800; }
.mrow-top .val { text-align: right; font-size: 14px; }
.mrow-top .val b { font-weight: 700; }
.mrow-top .pct { text-align: right; font-weight: 800; }
.mrow .track { height: 5px; margin-top: 5px; }
.mrow.pro .track i { background: var(--pro); }
.mrow.carb .track i { background: var(--carb); }
.mrow.fat .track i { background: var(--fat); }
.mrow .track.over i { background: var(--over); }
.split { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; padding-top: 2px; }
.split b { color: var(--ink); font-weight: 700; }

/* ---------- panels ---------- */
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.panel-h h3 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .06em; color: var(--muted); }
.slots { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--soft); border-radius: 10px; padding: 3px; gap: 3px; }
.slots button { border: 0; background: transparent; border-radius: 8px; padding: 9px 0; font-weight: 700; font-size: 14px; font-stretch: 90%; color: var(--muted); }
.slots button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.slots-hint { font-size: 12.5px; color: var(--muted); margin-top: -4px; }

.presets { display: flex; flex-wrap: wrap; gap: 8px; }
.preset {
  border: 1.5px solid var(--accent); background: var(--accent-soft); color: var(--ink);
  border-radius: 999px; padding: 7px 12px; display: flex; gap: 8px; align-items: baseline; text-align: left;
}
.preset b { font-weight: 700; font-size: 14px; }
.preset span { font-size: 12px; color: var(--muted); }
.preset:active { transform: scale(.97); }

.tools { display: flex; gap: 8px; align-items: center; }
.search { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; }
.cats { display: flex; flex-wrap: wrap; gap: 6px; }
.cat { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 11px; font-size: 13px; color: var(--muted); }
.cat[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

.foods { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 560px) { .foods { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 920px) { .foods { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1080px) { .foods { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.food {
  position: relative; text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: 9px;
  padding: 9px 10px 8px; display: flex; flex-direction: column; gap: 1px; min-height: 74px; min-width: 0;
  transition: transform .12s ease, border-color .15s ease;
}
.food:hover { border-color: var(--muted); }
.food:active { transform: scale(.96); }
.food.flash { border-color: var(--accent); background: var(--accent-soft); }
.food-name { font-weight: 700; font-size: 14.5px; line-height: 1.25; overflow-wrap: anywhere; }
.food-unit { font-size: 12px; color: var(--muted); }
.food-unit .wk { color: var(--accent); font-weight: 600; white-space: nowrap; }
.food-nums { margin-top: auto; padding-top: 3px; font-size: 12px; color: var(--muted); }
.food-nums b { color: var(--ink); font-weight: 800; font-size: 14px; }
.food-nums .p { color: var(--pro); font-weight: 700; }
.badge {
  position: absolute; top: 7px; right: 7px; min-width: 24px; height: 22px; padding: 0 6px; border-radius: 11px;
  background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 800; display: grid; place-items: center;
}
.food.addnew { border-style: dashed; color: var(--muted); justify-content: center; align-items: center; text-align: center; font-weight: 600; background: transparent; }
.tile {
  position: relative; display: flex; flex-direction: column; min-width: 0;
  border: 1px solid var(--line); background: var(--paper); border-radius: 9px; overflow: hidden;
  transition: border-color .15s ease;
}
.tile:hover { border-color: var(--muted); }
.tile.has { border-color: var(--accent); }
.tile > .food { flex: 1; width: 100%; border: 0; border-radius: 0; background: transparent; min-height: 64px; }
.tile > .food:active { transform: none; background: var(--soft); }
.tile > .food.flash { background: var(--accent-soft); }
.step { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); }
.tile.has .step { background: var(--accent-soft); border-top-color: var(--accent); }
.step button {
  width: 46px; height: 34px; border: 0; background: transparent; color: var(--accent);
  font-size: 20px; font-weight: 700; line-height: 1;
}
.step button:hover:not(:disabled) { background: var(--soft); }
.step button:disabled { color: var(--line); cursor: default; }
.step .cnt { font-weight: 800; font-size: 15px; min-width: 28px; text-align: center; }
.step .cnt.zero { color: var(--muted); font-weight: 600; }
.foods.manage .tile { border-style: dashed; }
.foods.manage .food-name { padding-right: 46px; }
.rm {
  border: 1px solid var(--over); color: var(--over); background: var(--paper); border-radius: 999px;
  font-size: 12px; font-weight: 700; padding: 2px 9px; line-height: 1.5;
}
.rm.armed { background: var(--over); color: var(--paper); }
.tile .rm { position: absolute; top: 6px; right: 6px; }
.manage-btn { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 11px; font-size: 13px; font-weight: 600; color: var(--muted); }
.manage-btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.preset.managing { border-style: dashed; border-color: var(--over); background: transparent; }
.preset .rm-label { color: var(--over); font-weight: 700; font-size: 12px; }
.preset.armed { background: var(--over); border-color: var(--over); }
.preset.armed b, .preset.armed .rm-label, .preset.armed span { color: var(--paper); }

/* ---------- log ---------- */
.meal { display: flex; flex-direction: column; }
.meal + .meal { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 2px; }
.meal-h { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; padding-bottom: 4px; }
.meal-h b { font-weight: 800; font-size: 15px; }
.meal-h .sum { font-size: 12.5px; color: var(--muted); }
.meal-h .acts { margin-left: auto; display: flex; gap: 12px; }
.link { border: 0; background: transparent; color: var(--accent); font-size: 13px; font-weight: 600; padding: 2px 0; }
.link.red { color: var(--over); }
.entry { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 6px; padding: 5px 0; }
.entry .en { min-width: 0; }
.entry .en div { font-size: 14.5px; font-weight: 600; overflow-wrap: anywhere; }
.entry .en small { font-size: 12px; color: var(--muted); }
.qty { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.qty button { width: 30px; height: 30px; border: 0; background: var(--soft); font-size: 17px; line-height: 1; }
.qty input { width: 42px; height: 30px; border: 0; text-align: center; background: var(--paper); font-weight: 700; -moz-appearance: textfield; }
.qty input::-webkit-outer-spin-button, .qty input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.ekcal { width: 44px; text-align: right; font-weight: 700; font-size: 14px; }
.del { height: 30px; padding: 0 8px; border: 1px solid var(--line); background: transparent; color: var(--over); border-radius: 8px; font-size: 13px; font-weight: 600; }
.del:hover { border-color: var(--over); }
.empty { color: var(--muted); font-size: 14px; padding: 6px 0; }

.footer-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 9px 14px; font-weight: 600; font-size: 14px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger { color: var(--over); }
.btn.danger.armed { background: var(--over); border-color: var(--over); color: var(--paper); }

/* ---------- sheet ---------- */
.overlay { position: fixed; inset: 0; z-index: 30; background: rgba(10, 14, 12, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--paper); width: 100%; max-width: 560px; max-height: 88%; overflow-y: auto;
  border-radius: 16px 16px 0 0;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
@media (min-width: 640px) { .overlay { align-items: center; } .sheet { border-radius: 14px; padding-bottom: 20px; } }
.sheet-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sheet-h h3 { margin: 0; font-size: 20px; font-weight: 900; font-stretch: 80%; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.form .full { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .03em; }
.field input, .field select { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 10px; width: 100%; min-width: 0; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.sheet-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.sheet-actions .spacer { flex: 1; }
.sec-h { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--muted); margin: 4px 0 -4px; }
.tgt { display: grid; grid-template-columns: 60px repeat(4, minmax(0, 1fr)); gap: 6px; align-items: center; }
.tgt .h { font-size: 11px; color: var(--muted); text-align: center; }
.tgt .rl { font-weight: 700; font-size: 13px; }
.tgt input { border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 7px 4px; width: 100%; min-width: 0; text-align: center; }
.weekdays { display: flex; gap: 6px; flex-wrap: wrap; }
.weekdays button { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: transparent; font-weight: 700; }
.weekdays button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.list { display: flex; flex-direction: column; }
.li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.li-acts { display: flex; gap: 6px; }
.li .t { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
.li small { display: block; font-size: 12px; color: var(--muted); }
.li .k { font-size: 13px; color: var(--muted); }
.muted { color: var(--muted); font-size: 13px; margin: 0; }

/* history */
.hist-sum { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--bg); border-radius: 9px; padding: 10px 12px; }
.stat small { display: block; font-size: 12px; color: var(--muted); }
.stat b { font-size: 24px; font-weight: 900; font-stretch: 80%; }
.hrow { display: grid; grid-template-columns: 74px minmax(0, 1fr) 62px; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); border-left: 0; border-right: 0; border-bottom: 0; background: transparent; text-align: left; width: 100%; }
.hrow .d { font-size: 13px; font-weight: 700; }
.hrow .d small { display: block; font-weight: 500; color: var(--muted); font-size: 11.5px; }
.hbar { position: relative; height: 12px; background: var(--soft); border-radius: 3px; }
.hbar i { position: absolute; inset: 0 auto 0 0; background: var(--ink); border-radius: 3px; }
.hbar i.over { background: var(--over); }
.hbar .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--accent); }
.hrow .v { text-align: right; font-size: 12.5px; }
.hrow .v b { display: block; font-size: 14px; }
.hrow .v span { color: var(--pro); }

/* toast */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 40;
  background: var(--ink); color: var(--bg); border-radius: 10px; padding: 10px 12px 10px 14px; display: flex; gap: 14px; align-items: center;
  width: max-content; max-width: calc(100% - 32px); font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.2);
}
.toast button { border: 0; background: transparent; color: var(--toast-accent); font-weight: 800; padding: 4px 2px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } .food:active, .preset:active { transform: none; } }
.lang-btn {
  border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px;
  padding: 5px 11px; font-size: 13px; font-weight: 700; line-height: 1.2;
}
.lang-btn:hover { border-color: var(--muted); }
</style>
<header class="topbar">
  <div class="topbar-in">
    <div class="datenav">
      <button class="iconbtn" id="prevDay" data-t-aria="prevDay">‹</button>
      <span class="date-title" id="dateTitle"></span>
      <button class="iconbtn" id="nextDay" data-t-aria="nextDay">›</button>
      <button class="today-link" id="todayBtn" data-t="backToday" hidden></button>
    </div>
    <div class="daytype" role="group" data-t-aria="dayTypeGroup">
      <button id="dtTrain" aria-pressed="false" data-t="trainingDay"></button>
      <button id="dtRest" aria-pressed="true" data-t="restDay"></button>
    </div>
    <button class="lang-btn" id="langBtn" data-t="langBtn" data-t-aria="langAria"></button>
    <div class="mini num" id="mini"></div>
  </div>
</header>

<main class="wrap">
  <div class="notice" id="noDb" data-t="noDb" hidden></div>
  <div class="grid">
    <section class="facts a-facts" id="facts" data-t-aria="summaryAria"></section>
    <section class="panel a-picker" data-t-aria="pickerAria">
      <div class="slots" role="group" data-t-aria="slotsAria" id="slots"></div>
      <div class="slots-hint" id="slotHint"></div>
      <div class="panel-h"><h3 id="presetsH"></h3><button class="manage-btn" data-manage aria-pressed="false"></button></div>
      <div class="presets" id="presets"></div>
      <div class="panel-h"><h3 id="foodsH"></h3><button class="manage-btn" data-manage aria-pressed="false"></button></div>
      <div class="tools">
        <input class="search" id="search" type="search" data-t-ph="searchPh" autocomplete="off">
      </div>
      <div class="cats" id="cats"></div>
      <div class="foods" id="foods"></div>
    </section>
    <section class="panel a-log" id="logPanel" data-t-aria="logAria">
      <div class="panel-h"><h3 data-t="logH"></h3><span class="muted num" id="logCount"></span></div>
      <div id="log"></div>
    </section>
    <div class="footer-actions a-foot">
      <button class="btn" id="openHistory" data-t="last14"></button>
      <button class="btn" id="openSettings" data-t="targetsFoods"></button>
    </div>
  </div>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div>
</div>
<div class="toast" id="toast" role="status" hidden><span id="toastMsg"></span><button id="toastUndo" data-t="undo"></button></div>

  let UNIT = "kcal";
  try { const v = localStorage.getItem("dietlog.unit"); if (v === "kJ" || v === "kcal") UNIT = v; } catch (e) {}

  // Read an energy field back to kcal; an untouched field keeps its exact stored value (no rounding drift).
  const readEnergy = (input, origKcal) => (input.value.trim() === input.dataset.shown && origKcal !== "" && origKcal != null
    ? num(origKcal) : Math.round(eIn(num(input.value)) * 10) / 10);

  const WD_EN = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const WD_ZH = ["日", "一", "二", "三", "四", "五", "六"];
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

    train: { kcal: 2200, p: 145, c: 290, f: 50 },
    rest: { kcal: 1780, p: 145, c: 130, f: 80 },

  };

  const $ = (id) => document.getElementById(id);

  const r1 = (n) => Math.round(n * 10) / 10;
  const fmt = (n) => Math.round(n).toLocaleString("en-US");
  const fmtQty = (q) => (Number.isInteger(q) ? String(q) : String(r1(q)));
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const fmtDate = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const parseDate = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const shiftDate = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return fmtDate(d); };
  const todayStr = () => fmtDate(new Date());
  const num = (v, d = 0) => { const n = parseFloat(v); return Number.isFinite(n) ? n : d; };
  const wd = (i) => (LANG === "zh" ? WD_ZH[i] : WD_EN[i]);
  const dateLabel = (s) => {
    const d = parseDate(s);
    return LANG === "zh" ? `${d.getMonth() + 1}月${d.getDate()}日 周${WD_ZH[d.getDay()]}` : `${WD_EN[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}`;

    const d = parseDate(s);

  // display names: each food has an English `name` and an optional Chinese `zh` (plus `unit` / `unit_zh`)
  const fname = (f) => (LANG === "zh" && f.zh ? f.zh : f.name || f.zh || "");
  const funit = (f) => (LANG === "zh" && f.unit_zh ? f.unit_zh : f.unit || t("oneServing"));
  const foodById = (id) => state.foods.find((f) => f.id === id);
  const FRAC = { "¼": 0.25, "½": 0.5, "¾": 0.75 };
  const PLURAL = { egg: "eggs", slice: "slices", bar: "bars", bag: "bags", bottle: "bottles", can: "cans", cup: "cups",
    bowl: "bowls", link: "links", piece: "pieces", handful: "handfuls", sandwich: "sandwiches", block: "blocks",
    serving: "servings", leaf: "leaves", pack: "packs", fruit: "fruits" };
  const fmtAmt = (v) => String(Math.round(v * 100) / 100);
  function scaleUnit(unit, qty) {
    if (!unit || qty === 1) return unit;

    if (!m || /kcal|kJ/i.test(unit)) return `${fmtQty(qty)} × ${unit}`;
    const base = FRAC[m[1]] ?? parseFloat(m[1]);
    let rest = m[3];
    if (qty !== 1) rest = rest.replace(/^([A-Za-z]+)\b/, (w) => PLURAL[w.toLowerCase()] || w);
    return `${fmtAmt(base * qty)}${m[2]}${rest}`;
  }
  const ename = (e) => {
    const f = e.food && foodById(e.food);
    return LANG === "zh" ? e.zh || (f && f.zh) || e.name : e.name || (f && f.name) || e.zh || "";
  };
  const eunit = (e) => {
    const f = e.food && foodById(e.food);

  // Meal slot from the device's local time (the user's time zone):
  // 05:00–11:30 breakfast, 11:30–16:30 lunch, 16:30–21:00 dinner, 21:00–05:00 snack.
  function autoSlot(now = new Date()) {
    const m = now.getHours() * 60 + now.getMinutes();
    if (m >= 5 * 60 && m < 11 * 60 + 30) return "b";
    if (m >= 11 * 60 + 30 && m < 16 * 60 + 30) return "l";
    if (m >= 16 * 60 + 30 && m < 21 * 60) return "d";
    return "s";

  const emptyDay = (date) => ({ date, dayType: null, entries: [] });

  const state = {
    db: null, noDb: false,

    presets: [],

    date: todayStr(),
    day: emptyDay(todayStr()),
    dayLoaded: false,
    slot: autoSlot(),
    slotManual: false,
    cat: "All",
    q: "",
    flashId: null,
    manage: false,
    armed: null,
    recent: {},        // foodId -> { n: times logged in the last 7 days, q: servings }
    recentLoaded: false,

  };

  /* ---------- derived ---------- */
  const dayTypeOf = (day) => day.dayType || (state.targets.trainDays.includes(parseDate(day.date).getDay()) ? "train" : "rest");
  const targetOf = (day) => state.targets[dayTypeOf(day)] || DEFAULT_TARGETS[dayTypeOf(day)];
  const totals = (entries) => entries.reduce((a, e) => {
    a.kcal += e.kcal * e.qty; a.p += e.p * e.qty; a.c += e.c * e.qty; a.f += e.f * e.qty; return a;

  /* ---------- day persistence: one serialized write at a time ---------- */
  let flushTimer = null, writing = false, dirty = false, chain = Promise.resolve(), unsubDay = null;

  function commitDay() {
    dirty = true;

    flushTimer = setTimeout(flush, 400);
  }
  function flush() {
    clearTimeout(flushTimer); flushTimer = null;
    chain = chain.then(writeDay);

  }
  async function writeDay() {
    if (!dirty || !state.db) return;
    dirty = false;

    writing = true;
    try {
      await state.db.doc("days/" + body.date).set(body);
    } catch (e) {

  }
  function subscribeDay() {

      if (state.date !== d) return;
      if (dirty || writing || flushTimer) return;
      state.day = snap.exists ? Object.assign(emptyDay(d), clone(snap.data())) : emptyDay(d);
      if (!Array.isArray(state.day.entries)) state.day.entries = [];

  }
  async function goDate(d) {

    state.date = d;
    state.day = emptyDay(d);
    state.dayLoaded = false;
    if (d === todayStr()) { state.slot = autoSlot(); state.slotManual = false; }
    render();
    subscribeDay();
  }

  /* ---------- actions ---------- */
  function withUndo(msg, mutate) {
    const date = state.date;
    const before = clone(state.day.entries);

      state.day.entries = before;
      commitDay();
    });
  }
  function pushFood(food, qty, slot) {
    const hit = state.day.entries.find((e) => e.food === food.id && e.meal === slot);
    if (hit) { hit.qty = r1(hit.qty + qty); return; }
    const entry = {
      id: uid(), food: food.id, name: food.name || food.zh || "", unit: food.unit || "",
      qty: r1(qty), kcal: num(food.kcal), p: num(food.p), c: num(food.c), f: num(food.f),
      meal: slot, t: Date.now(),
    };
    if (food.zh) entry.zh = food.zh;
    if (food.unit_zh) entry.unit_zh = food.unit_zh;
    state.day.entries.push(entry);
  }
  function addFood(id) {
    const food = foodById(id);
    if (!food) return;
    withUndo(t("tAdd", slotName(state.slot), fname(food)), () => pushFood(food, 1, state.slot));
    state.flashId = id;
    setTimeout(() => { if (state.flashId === id) { state.flashId = null; renderFoods(); } }, 380);
    renderFoods();
  }
  function minusFood(id) {
    const hits = state.day.entries.filter((e) => e.food === id && e.meal === state.slot);
    const e = hits[hits.length - 1];
    if (!e) return;
    withUndo(t("tMinus", slotName(state.slot), ename(e)), () => {
      if (e.qty > 1) e.qty = r1(e.qty - 1);

  }
  function addPreset(id) {
    const pr = state.presets.find((p) => p.id === id);

    let missing = 0;
    withUndo(t("tLogged", slotName(slot), pr.name), () => {
      (pr.items || []).forEach((it) => {
        const food = foodById(it.food);
        if (food) pushFood(food, num(it.qty, 1), slot); else missing++;
      });
    });
    if (missing) toast(t("tMissing", missing, pr.name));
  }
  function setQty(entryId, q) {
    const e = state.day.entries.find((x) => x.id === entryId);

    commitDay();
  }
  function removeEntry(entryId) {
    const e = state.day.entries.find((x) => x.id === entryId);

  /* ---------- render ---------- */

      `<span>${t("proteinMini", fmt(tot.p), fmt(tg.p))}</span>`;

  function pct(v, tgt) { return tgt > 0 ? Math.round((v / tgt) * 100) : 0; }

      </div>

      <div class="remain num${left < 0 ? " over" : ""}">${left >= 0 ? t("remainLeft", eFmt(left), UNIT) : t("remainOver", eFmt(-left), UNIT)}</div>

        <span class="food-name">${esc(nm)}</span>

  /* ---------- toast ---------- */
  let toastTimer = null, undoFn = null;

  /* ---------- sheets ---------- */
  let sheetMode = null, returnTo = null;

  const sheetHead = (title) => `<div class="sheet-h"><h3>${esc(title)}</h3><button class="iconbtn" data-close aria-label="${t("close")}">×</button></div>`;

  // food form: mode "new" | "edit" | "once"

  async function translateFood(from, name, unit) {
    const sample = await getSample();
    if (!sample || typeof sample.json !== "function") return null;
    const src = from === "zh" ? "Chinese" : "English";
    const dst = from === "zh" ? "English" : "Simplified Chinese";
    const prompt =
      `Translate this item from a personal food log from ${src} to ${dst}. ` +
      `It is a food name and its serving size. Keep brand names (e.g. Fairlife, Premier, Quest, McDonald's, Bibigo) as they are, ` +
      `keep numbers and units such as g, ml, kcal, lb and oz unchanged, and keep it short like a product label.\n` +

      if (v && typeof v === "object") return { name: String(v.name || "").trim(), unit: String(v.unit || "").trim() };
    } catch (e) { /* fall through: save without the translation */ }

  const bothNames = (d) => {

    returnTo = back || null;
    const zhUI = LANG === "zh";
    const title = mode === "edit" ? t("editFood") : mode === "new" ? t("newFoodTitle") : t("oneOffTitle");
    const enName = `<div class="field"><label for="ff-name">${zhUI ? t("lblNameEnOpt") : t("lblNameEnReq")}</label><input id="ff-name" value="${esc(f.name)}" placeholder="${esc(t("phName"))}"></div>`;
    const zhName = `<div class="field"><label for="ff-zh">${zhUI ? t("lblNameZhReq") : t("lblNameZhOpt")}</label><input id="ff-zh" value="${esc(f.zh || "")}" placeholder="${esc(t("phNameZh"))}"></div>`;
    const enUnit = `<div class="field"><label for="ff-unit">${zhUI ? t("lblUnitEnOpt") : t("lblUnitEnPri")}</label><input id="ff-unit" value="${esc(f.unit)}" placeholder="${esc(t("phUnit"))}"></div>`;
    const zhUnit = `<div class="field"><label for="ff-unitzh">${zhUI ? t("lblUnitZhPri") : t("lblUnitZhOpt")}</label><input id="ff-unitzh" value="${esc(f.unit_zh || "")}" placeholder="${esc(t("phUnitZh"))}"></div>`;
    openSheet(`${sheetHead(title)}
      <form class="form" id="foodForm" novalidate>
        ${zhUI ? zhName + enName + zhUnit + enUnit : enName + zhName + enUnit + zhUnit}
        <div class="field full"><label for="ff-cat">${t("lblCat")}</label><select id="ff-cat">${catOptions(f.cat || "Other")}</select></div>
        <div class="field"><label for="ff-kcal">${t("lblKcal", UNIT)}</label><input id="ff-kcal" type="number" inputmode="decimal" value="${esc(eInputVal(f.kcal))}" data-shown="${esc(eInputVal(f.kcal))}"></div>
        <div class="field"><label for="ff-p">${t("lblP")}</label><input id="ff-p" type="number" inputmode="decimal" value="${esc(f.p)}"></div>
        <div class="field"><label for="ff-c">${t("lblC")}</label><input id="ff-c" type="number" inputmode="decimal" value="${esc(f.c)}"></div>
        <div class="field"><label for="ff-f">${t("lblF")}</label><input id="ff-f" type="number" inputmode="decimal" value="${esc(f.f)}"></div>
        ${mode === "once" ? `<label class="check full"><input type="checkbox" id="ff-save"> ${t("alsoSave")}</label>` : ""}
        <p class="muted full" id="ff-err" hidden></p>
        <div class="sheet-actions full">
          ${mode === "edit" ? `<button type="button" class="btn danger" id="ff-del">${t("del")}</button>` : ""}
          <span class="spacer"></span>
          <button type="button" class="btn" data-close>${t("cancel")}</button>
          <button type="submit" class="btn primary" id="ff-submit">${mode === "once" ? t("logTo", slotName(state.slot)) : t("save")}</button>
        </div>
      </form>`, "food");
    const form = $("foodForm");
    let busy = false;
    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      if (busy) return;
      let name = $("ff-name").value.trim(), zh = $("ff-zh").value.trim();
      let unit = $("ff-unit").value.trim(), unitZh = $("ff-unitzh").value.trim();
      const err = $("ff-err");
      const kcal = readEnergy($("ff-kcal"), f.kcal);
      if (zhUI ? !zh : !name) { err.hidden = false; err.textContent = t("errNameReq"); return; }
      if ($("ff-kcal").value.trim() === "" || !(kcal >= 0)) { err.hidden = false; err.textContent = t("errKcal"); return; }
      err.hidden = true;

      // fill the other language when it was left blank
      const needName = zhUI ? !name : !zh;
      const srcUnit = zhUI ? unitZh : unit;
      const needUnit = !!srcUnit && !(zhUI ? unit : unitZh);
      let translateFailed = false;
      if (needName || needUnit) {
        busy = true;
        const btn = $("ff-submit"), label = btn.textContent;
        btn.disabled = true; btn.textContent = t("translating");
        const tr = await translateFood(zhUI ? "zh" : "en", zhUI ? zh : name, srcUnit);
        busy = false;
        if (!$("ff-submit")) return; // the sheet was closed meanwhile
        btn.disabled = false; btn.textContent = label;
        if (tr && tr.name) {
          if (needName) { if (zhUI) name = tr.name; else zh = tr.name; }
          if (needUnit && tr.unit) { if (zhUI) unit = tr.unit; else unitZh = tr.unit; }
        } else {
          translateFailed = true;
        }
      }
      if (!name) name = zh;
      if (!unit) unit = unitZh || "1 serving";
      const data = {
        name, unit, cat: $("ff-cat").value,
        kcal, p: num($("ff-p").value), c: num($("ff-c").value), f: num($("ff-f").value),
      };
      if (zh) data.zh = zh;
      if (unitZh) data.unit_zh = unitZh;
      const after = (msg) => toast(translateFailed ? t("translateFailed") : msg);

      if (mode === "once") {
        const foodRef = { id: null };
        if ($("ff-save").checked) {
          const id = "f-" + uid();
          data.sort = 900 + state.foods.length;
          try { await state.db.doc("foods/" + id).set(data); foodRef.id = id; }
          catch (e) { err.hidden = false; err.textContent = t("errSaveFoods"); }
        }
        const entry = { id: uid(), food: foodRef.id, name: data.name, unit: data.unit, qty: 1, kcal: data.kcal, p: data.p, c: data.c, f: data.f, meal: state.slot, t: Date.now() };
        if (data.zh) entry.zh = data.zh;
        if (data.unit_zh) entry.unit_zh = data.unit_zh;
        state.day.entries.push(entry);
        commitDay();
        returnTo = null; closeSheet();
        after(t("tLogged", slotName(state.slot), bothNames(data)));
        return;
      }
      const id = mode === "edit" ? food.id : "f-" + uid();
      data.sort = mode === "edit" ? num(food.sort, 500) : 900 + state.foods.length;
      try {
        await state.db.doc("foods/" + id).set(data);
        closeSheet();
        after(mode === "edit" ? t("savedName", bothNames(data)) : t("addedToFoods", bothNames(data)));
      } catch (e) { err.hidden = false; err.textContent = t("saveFailed"); }
    });
    const del = $("ff-del");
    if (del) del.addEventListener("click", async () => {
      if (!del.classList.contains("armed")) { del.classList.add("armed"); del.textContent = t("tapAgainDelete"); return; }
      try { await state.db.doc("foods/" + food.id).delete(); closeSheet(); toast(t("removedFood", fname(food))); }
      catch (e) { $("ff-err").hidden = false; $("ff-err").textContent = t("deleteFailed"); }
    });
  }

  function openTargets(back) {
    returnTo = back || null;
    const T = state.targets;
    const cur = dayTypeOf(state.day);
    const days = T.trainDays.slice();
    const block = (key) => `
      <div class="tcard${key === cur ? " cur" : ""}">
        <div class="tcard-h"><b>${key === "train" ? t("trainingDay") : t("restDay")}</b>${key === cur ? `<span class="tbadge">${t(state.date === todayStr() ? "todayBadge" : "thisDayBadge")}</span>` : ""}</div>
        <label class="tk" for="t-${key}-kcal"><span>${t("calories")}</span><span class="tk-in"><input class="num" type="number" inputmode="numeric" min="0" id="t-${key}-kcal" value="${esc(eInputVal(T[key].kcal))}" data-shown="${esc(eInputVal(T[key].kcal))}"> ${UNIT}</span></label>
        <div class="tm">${["p", "c", "f"].map((k) => `<label for="t-${key}-${k}"><span>${t(k === "p" ? "protein" : k === "c" ? "carbs" : "fat")}</span><span class="tk-in"><input class="num" type="number" inputmode="decimal" min="0" id="t-${key}-${k}" value="${esc(T[key][k])}"> g</span></label>`).join("")}</div>
        <p class="muted tsum num" id="t-${key}-sum"></p>
      </div>`;
    openSheet(`${sheetHead(t("dailyTargets"))}
      <div id="tgtWrap" style="display:flex;flex-direction:column;gap:12px">
        ${cur === "train" ? block("train") + block("rest") : block("rest") + block("train")}
        <div class="sec-h">${t("defaultTrainDays")}</div>
        <div class="weekdays" id="wd">${[1, 2, 3, 4, 5, 6, 0].map((d) => `<button type="button" data-wd="${d}" aria-pressed="${days.includes(d)}">${wd(d)}</button>`).join("")}</div>
        <p class="muted" id="t-err" hidden></p>
        <div class="sheet-actions"><span class="spacer"></span><button type="button" class="btn" data-close>${t("cancel")}</button><button type="button" class="btn primary" id="saveTargets">${t("saveTargets")}</button></div>
      </div>`, "targets");
    const val = (key, k) => num($(`t-${key}-${k}`).value);
    const upd = (key) => { $(`t-${key}-sum`).textContent = t("macroSum", eFmt(4 * val(key, "p") + 4 * val(key, "c") + 9 * val(key, "f")), fmt(val(key, "kcal")), UNIT); };
    upd("train"); upd("rest");
    $("tgtWrap").addEventListener("input", (e) => { const m = (e.target.id || "").match(/^t-(train|rest)-/); if (m) upd(m[1]); });
    $("wd").addEventListener("click", (e) => {
      const b = e.target.closest("[data-wd]"); if (!b) return;
      const d = Number(b.dataset.wd); const i = days.indexOf(d);
      if (i >= 0) days.splice(i, 1); else days.push(d);
      b.setAttribute("aria-pressed", String(days.includes(d)));
    });
    $("saveTargets").addEventListener("click", async () => {
      const read = (key) => ({ kcal: readEnergy($(`t-${key}-kcal`), T[key].kcal), p: val(key, "p"), c: val(key, "c"), f: val(key, "f") });
      const data = { train: read("train"), rest: read("rest"), trainDays: days.slice().sort() };
      if (!(data.train.kcal > 0) || !(data.rest.kcal > 0)) { $("t-err").hidden = false; $("t-err").textContent = t("errTargetKcal"); return; }
      try {
        await state.db.doc("settings/targets").set(data);
        state.targets = clone(data);
        renderTop(); renderFacts();
        closeSheet();
        toast(t("targetsSaved"));
      } catch (e) { $("t-err").hidden = false; $("t-err").textContent = t("targetsFailed"); }
    });
  }

  async function openHistory() {
    openSheet(`${sheetHead(t("last14"))}<p class="muted">${t("loading")}</p>`, "history");
    const today = todayStr(), from = shiftDate(today, -13);
    let byDate = {};
    try {
      const snap = await state.db.collection("days").where("date", ">=", from).get();
      snap.docs.forEach((d) => { const v = d.data(); if (v && v.date) byDate[v.date] = clone(v); });
    } catch (e) {
      if (sheetMode === "history") $("sheet").innerHTML = `${sheetHead(t("last14"))}<p class="muted">${t("loadFailed")}</p>`;
      return;
    }
    if (state.date >= from) byDate[state.date] = clone(state.day);
    const rows = [];
    for (let i = 0; i < 14; i++) {
      const d = shiftDate(today, -i);
      const day = Object.assign(emptyDay(d), byDate[d] || {});
      rows.push({ d, day, tot: totals(day.entries || []), tg: targetOf(day), type: dayTypeOf(day) });
    }
    const logged7 = rows.slice(0, 7).filter((r) => r.day.entries && r.day.entries.length);
    const avgK = logged7.length ? logged7.reduce((a, r) => a + r.tot.kcal, 0) / logged7.length : 0;
    const avgP = logged7.length ? logged7.reduce((a, r) => a + r.tot.p, 0) / logged7.length : 0;
    const max = Math.max(1, ...rows.map((r) => Math.max(r.tot.kcal, r.tg.kcal))) * 1.04;
    if (sheetMode !== "history") return;
    $("sheet").innerHTML = `${sheetHead(t("last14"))}
      <div class="hist-sum">
        <div class="stat"><small>${t("avgCal")}</small><b class="num">${logged7.length ? eFmt(avgK) : "–"}</b> <small>${t("kcalDays", logged7.length, UNIT)}</small></div>
        <div class="stat"><small>${t("avgP")}</small><b class="num">${logged7.length ? fmt(avgP) : "–"}</b> <small>g</small></div>
      </div>
      <p class="muted">${t("histNote")}</p>
      <div>${rows.map((r) => {
        const has = r.day.entries && r.day.entries.length;
        const over = r.tot.kcal > r.tg.kcal;
        return `<button class="hrow" data-goto="${r.d}">
          <span class="d num">${shortDate(r.d)}<small>${r.type === "train" ? t("trainingDay") : t("restDay")}</small></span>
          <span class="hbar">${has ? `<i class="${over ? "over" : ""}" style="width:${(r.tot.kcal / max) * 100}%"></i>` : ""}<span class="tick" style="left:calc(${(r.tg.kcal / max) * 100}% - 1px)"></span></span>
          <span class="v num">${has ? `<b>${eFmt(r.tot.kcal)}</b><span>${fmt(r.tot.p)}g</span>` : `<small class="muted">${t("notLogged")}</small>`}</span>
        </button>`;
      }).join("")}</div>`;
  }

  });
  $("log").addEventListener("click", (e) => {
    const btn = e.target.closest("button"); if (!btn) return;
    const step = (id, d) => { const en = state.day.entries.find((x) => x.id === id); if (en) setQty(id, Math.max(0.5, r1(en.qty + d))); };
    if (btn.dataset.inc) step(btn.dataset.inc, 0.5);
    else if (btn.dataset.dec) step(btn.dataset.dec, -0.5);
    else if (btn.dataset.del) removeEntry(btn.dataset.del);
    else if (btn.dataset.savepreset) openPresetForm(btn.dataset.savepreset);
    else if (btn.dataset.clearmeal) {

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden" && (dirty || flushTimer)) flush();
    if (document.visibilityState === "visible") {
      // coming back to the page later: follow the clock again unless a meal was picked by hand
      if (state.date === todayStr() && !state.slotManual) {
        const s = autoSlot();
        if (s !== state.slot) { state.slot = s; renderSlots(); renderFoods(); }
      }
      if (state.recentLoaded) { refreshOrder(); renderFoods(); }
    }
  });

  /* ---------- weekly ranking: times logged in the last 7 days, ties alphabetical (pinyin in Chinese) ---------- */
  function refreshOrder() {
    const r = (f) => state.recent[f.id] || { n: 0, q: 0 };
    const coll = collator();
    state.order = state.foods.slice()
      .sort((a, b) => r(b).n - r(a).n || coll.compare(fname(a), fname(b)))
      .map((f) => f.id);
  }
  function subscribeRecent() {
    const from = shiftDate(todayStr(), -6);
    state.db.collection("days").where("date", ">=", from).onSnapshot((snap) => {
      const rec = {};
      snap.docs.forEach((d) => {
        const v = d.data() || {};
        if (!v.date || v.date < from) return;
        (v.entries || []).forEach((e) => {
          if (!e.food) return;
          const x = rec[e.food] || (rec[e.food] = { n: 0, q: 0 });
          x.n += 1; x.q += num(e.qty, 1);
        });
      });
      state.recent = rec;
      if (!state.recentLoaded) { state.recentLoaded = true; refreshOrder(); }
      renderFoods();
    }, () => {});
  }

  /* ---------- boot ---------- */
  applyStatic();
  render();
  (async () => {
    let db = null;
    try { db = window.claude && typeof window.claude.use === "function" ? await window.claude.use("db") : null; } catch (e) { db = null; }
    if (!db) { state.noDb = true; $("noDb").hidden = false; render(); return; }
    state.db = db;
    db.collection("foods").onSnapshot((snap) => {
      state.foods = snap.docs.map((d) => Object.assign({ id: d.id }, clone(d.data())))
        .sort((a, b) => num(a.sort, 999) - num(b.sort, 999));
      if (!state.foodsLoaded || !state.recentLoaded) refreshOrder();
      state.foodsLoaded = true;
      renderCats(); renderFoods(); renderPresets();
    }, () => { state.foodsLoaded = true; renderFoods(); });
    db.collection("presets").onSnapshot((snap) => {
      state.presets = snap.docs.map((d) => Object.assign({ id: d.id }, clone(d.data()))).sort((a, b) => num(a.sort, 999) - num(b.sort, 999));
      renderPresets();
    }, () => {});
    db.doc("settings/targets").onSnapshot((snap) => {
      if (snap.exists) {
        const v = clone(snap.data());
        state.targets = {
          train: Object.assign({}, DEFAULT_TARGETS.train, v.train), rest: Object.assign({}, DEFAULT_TARGETS.rest, v.rest),
          trainDays: Array.isArray(v.trainDays) ? v.trainDays : DEFAULT_TARGETS.trainDays,
        };
        renderTop(); renderFacts();
      }
    }, () => {});
    subscribeDay();
    subscribeRecent();
  })();
})();
</script>
